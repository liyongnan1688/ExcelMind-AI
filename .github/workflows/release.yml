name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.3.0 或 v1.3.0-rc2，必须以 v 开头并符合语义化版本)'
        required: true
      target_commitish:
        description: '可选目标 Commit SHA；必须与当前构建提交一致'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Package
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.meta.outputs.should_publish }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          cd web
          pnpm install --frozen-lockfile
          cd ..

      - name: Build C# Add-In
        shell: pwsh
        run: |
          pwsh -File build_addin.ps1

      - name: Run Offline Quality Gates
        shell: pwsh
        run: |
          node test_suite_unit.cjs
          node test_regex_counter_example.cjs
          pwsh -File tests/diagnostics/verify_security_baseline.ps1
          pnpm --dir web run check

      - name: Determine Version and Publication Policy
        id: meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TARGET_COMMITISH: ${{ github.event.inputs.target_commitish }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $shouldPublish = $false
          $v = ""
          $tag = ""
          $isPre = $false
          $versionPattern = '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              $inputVer = [string]$env:INPUT_VERSION
              $inputVer = $inputVer.Trim()
              $targetCommit = [string]$env:INPUT_TARGET_COMMITISH
              $targetCommit = $targetCommit.Trim()
              if ([string]::IsNullOrWhiteSpace($inputVer)) {
                  Write-Error "workflow_dispatch triggered without version input. Publication rejected."
                  exit 1
              }
              if ($inputVer -notmatch $versionPattern) {
                  Write-Error "Invalid version format: '$inputVer'. Version must be strict SemVer and start with v."
                  exit 1
              }
              if (-not [string]::IsNullOrWhiteSpace($targetCommit) -and
                  -not [string]::Equals($targetCommit, $env:BUILD_SHA, [StringComparison]::OrdinalIgnoreCase)) {
                  Write-Error "target_commitish must match the current build commit '$($env:BUILD_SHA)'."
                  exit 1
              }
              $v = $inputVer
              $tag = $inputVer
              $isPre = ($v -match '-(rc|alpha|beta|preview|dev)')
              $shouldPublish = $true
              Write-Host "Manual workflow dispatch: Version=$v, Prerelease=$isPre"
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
              $tag = $env:GITHUB_REF_NAME
              if ($tag -notmatch $versionPattern) {
                  Write-Host "Tag '$tag' does not match strict SemVer. Skipping publication."
                  $shouldPublish = $false
                  $v = "ci-build"
              } else {
                  $v = $tag
                  $isPre = ($v -match '-(rc|alpha|beta|preview|dev)')
                  $shouldPublish = $true
                  Write-Host "Version tag push: Version=$v, Prerelease=$isPre"
              }
          } else {
              Write-Host "Triggered by branch push or pull request without version tag."
              Write-Host "Running CI build & quality checks only. Release publication is DISABLED."
              $shouldPublish = $false
              $v = "ci-build"
          }

          echo "should_publish=$shouldPublish" >> $env:GITHUB_OUTPUT
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "is_prerelease=$isPre" >> $env:GITHUB_OUTPUT

      - name: Build Release Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          pwsh -File scripts/package_release.ps1 -Version "$env:RELEASE_VERSION"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: .artifacts/release/*.zip
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: .artifacts/release

      - name: Guard Against Overwriting Existing Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $tag = [string]$env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
              Write-Error "Release tag is empty. Publication blocked."
              exit 1
          }
          $headers = @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "User-Agent" = "GitHub-Actions-Release-Guard"
          }
          $apiUrl = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          try {
              $existing = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get -ErrorAction Stop
              if ($existing -and $existing.id) {
                  Write-Error "Release for tag '$tag' already exists (Release ID: $($existing.id)). Overwriting is prohibited."
                  exit 1
              }
          } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 404 -or $_.Exception.Message -match "404") {
                  Write-Host "Verified: Tag '$tag' has no existing release. Safe to publish."
              } else {
                  Write-Error "Could not verify release existence: $($_.Exception.Message). Publication blocked."
                  exit 1
              }
          }

      - name: Upload Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "ExcelMind AI ${{ needs.build.outputs.version }}"
          draft: false
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            .artifacts/release/*.zip
          body: |
            ## ExcelMind AI 桌面原生插件发布包

            ### 下载与运行指南
            1. 下载下方的 `ExcelMindAI-${{ needs.build.outputs.version }}.zip` 压缩包并解压；
            2. **方式一（一键安装常驻）**：双击运行 `安装插件(开启常驻).bat`，自动解除系统下载锁定并写入 Excel 启动项；
            3. **方式二（便携免安装）**：双击运行 `免安装启动.bat`，即开即用，关闭 Excel 即退出；
            4. 打开任意 Excel 文件，顶部功能区将自动出现 **【ExcelMind AI】** 选项卡。

            ---

            ### 系统与 Office 兼容性
            - **系统环境**：Windows 7 SP1 / Windows 10 / Windows 11（32 位与 64 位自适应）
            - **Office 支持**：Office 2010 / 2013 / 2016 / 2019 / 2021 及 Microsoft 365
            - **自动化构建**：本分发包由 GitHub Actions CI/CD 在 Windows 官方原生纯净环境中编译打包。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}